services:
  postgres:
    image: postgres:16-alpine
    container_name: redis-lab-postgres
    environment:
      POSTGRES_DB: redislab
      POSTGRES_USER: redislab
      POSTGRES_PASSWORD: redislab
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redislab -d redislab"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis 8 ships JSON, the Query Engine (search), Bloom/probabilistic types, TimeSeries and
  # Vector Sets built in. AOF persistence is on; keyspace notifications feed the TTL demo.
  redis:
    image: redis:8.2-alpine
    container_name: redis-lab-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: redis-lab-backend
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: -Xmx768m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Production build served by nginx on :80. The container name and tunnel-net match the
  # Cloudflare tunnel route (http://rixus-frontend:80), so pipeline-run.sh can publish it.
  frontend:
    build: ./frontend
    container_name: rixus-frontend
    ports:
      - "3000:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - default
      - tunnel-net
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  tunnel-net:
    external: true
