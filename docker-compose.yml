# Host ports are bound to 127.0.0.1: Docker's iptables rules bypass ufw, so a bare "6379:6379"
# would put an unauthenticated Redis on the server's public IP. POSTGRES_PASSWORD comes from
# the git-ignored .env with no fallback (pipeline-run.sh generates it on first deploy).
services:
  postgres:
    image: postgres:16-alpine
    container_name: redis-lab-postgres
    environment:
      POSTGRES_DB: redislab
      POSTGRES_USER: redislab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redislab -d redislab"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 512m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  # Redis 8 ships JSON, the Query Engine (search), Bloom/probabilistic types, TimeSeries and
  # Vector Sets built in. AOF persistence is on; keyspace notifications feed the TTL demo.
  redis:
    image: redis:8.2-alpine
    container_name: redis-lab-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --notify-keyspace-events
      - Ex
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 768m
    pids_limit: 256
    security_opt:
      - no-new-privileges:true

  backend:
    build: ./backend
    container_name: redis-lab-backend
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JAVA_TOOL_OPTIONS: -Xmx768m
    networks:
      - default
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Production build served by unprivileged nginx on :80
  frontend:
    build: ./frontend
    container_name: rixus-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    networks:
      - default
      - tunnel-net
    depends_on:
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  # Redis, Postgres and the backend; the public nginx container is not on it. Not internal:
  # Redis and Postgres publish loopback host ports for redis-cli / psql from the host.
  backend-net:
  tunnel-net:
    external: true
